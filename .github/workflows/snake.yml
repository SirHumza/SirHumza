name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: SirHumza
          outputs: |
            dist/github-snake.svg?color_snake=9E2B25&color_dots=ebedf0,d3f0da,a9e5bd,52d273,1E5B33
            dist/github-snake-dark.svg?palette=github-dark&color_snake=D43A2F&color_dots=14231a,1E5B33,2E9E5B,52D273,B9F5CE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
